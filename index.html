<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tried</title>
<meta name="description" content="Products I've actually used, arranged the way I think about them.">
<meta property="og:title" content="Tried">
<meta property="og:description" content="Products I've actually used, arranged the way I think about them.">
<meta property="og:type" content="website">
<style>
  :root {
    --ink: #191C24;
    --ink-soft: #5A6070;
    --field: #D6DBD2;
    --field-deep: #C4CABE;
    --paper: #FCFBF8;
    --mulberry: #77384F;
    --brass: #A8863F;
    --line: rgba(25, 28, 36, 0.13);
    --line-soft: rgba(25, 28, 36, 0.07);
    --display: 'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, sans-serif;
    --mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--body); color: var(--ink); background: var(--field);
    min-height: 100vh; -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 26px 20px 70px; }

  .mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; flex-wrap: wrap; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .mast-title { font-family: var(--display); font-size: 44px; line-height: 0.95; letter-spacing: -0.02em; margin: 0; font-weight: 400; }
  .mast-sub { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--ink-soft); margin-top: 8px; }
  .intro { font-size: 15px; line-height: 1.6; color: var(--ink-soft); max-width: 46ch; margin: 14px 0 0; }
  .mast-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .btn { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; padding: 9px 14px; border-radius: 2px; border: 1px solid var(--ink); background: transparent; color: var(--ink); cursor: pointer; transition: background .14s, color .14s; }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn:focus-visible { outline: 2px solid var(--mulberry); outline-offset: 2px; }
  .btn-solid { background: var(--ink); color: var(--paper); }
  .btn-solid:hover { background: var(--mulberry); border-color: var(--mulberry); }
  .btn-quiet { border-color: transparent; color: var(--ink-soft); padding: 9px 10px; }
  .btn-quiet:hover { background: transparent; color: var(--mulberry); }

  .seg { display: inline-flex; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; }
  .seg button { font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; padding: 9px 15px; border: 0; background: transparent; color: var(--ink); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
  .seg button:focus-visible { outline: 2px solid var(--mulberry); outline-offset: -2px; }

  .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: 1px solid var(--line); margin-top: 18px; }
  .metric { background: var(--field); padding: 15px 4px 16px; }
  .metric-label { font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); }
  .metric-value { font-family: var(--display); font-size: 30px; line-height: 1.05; margin-top: 5px; }
  .metric-value .unit { font-size: 15px; color: var(--ink-soft); }
  .metric-value.small { font-size: 18px; line-height: 1.5; }

  .filters { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; padding: 15px 0 16px; }
  .chip { font-family: var(--mono); font-size: 10.5px; letter-spacing: .06em; padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--ink-soft); cursor: pointer; }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
  .chip:focus-visible { outline: 2px solid var(--mulberry); outline-offset: 2px; }
  .filters-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
  .hint { font-family: var(--mono); font-size: 10px; letter-spacing: .07em; color: var(--ink-soft); text-transform: uppercase; }

  .zoom { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .zoom button { font-family: var(--mono); font-size: 11px; background: transparent; border: 0; color: var(--ink); cursor: pointer; padding: 6px 11px; line-height: 1; }
  .zoom button:hover { background: var(--ink); color: var(--paper); }
  .zoom button:focus-visible { outline: 2px solid var(--mulberry); outline-offset: -2px; }
  .zoom-value { min-width: 44px; border-left: 1px solid var(--line); border-right: 1px solid var(--line); letter-spacing: .04em; }

  /* free canvas (desktop) */
  .canvas-viewport { position: relative; height: 72vh; min-height: 480px; border: 1px solid var(--line); background: var(--field-deep); border-radius: 3px; overflow: auto; }
  .canvas-viewport.full-bleed { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); border-radius: 0; border-left: 0; border-right: 0; }
  .canvas { position: relative; background-image: radial-gradient(circle at 1px 1px, rgba(25,28,36,.10) 1px, transparent 0); background-size: 26px 26px; transform-origin: 0 0; }
  .canvas.editing { touch-action: none; }

  /* flow fallback (mobile) */
  .flow { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; }

  .card { width: 224px; background: var(--paper); border: 1px solid var(--line); border-radius: 2px; display: flex; box-shadow: 0 1px 2px rgba(25,28,36,.10), 0 6px 14px rgba(25,28,36,.07); }
  .canvas .card { position: absolute; }
  .flow .card { width: auto; position: static; }
  .canvas.editing .card { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; }
  .card.dragging { cursor: grabbing; box-shadow: 0 6px 10px rgba(25,28,36,.16), 0 20px 36px rgba(25,28,36,.16); z-index: 40; }
  .card:focus-visible { outline: 2px solid var(--mulberry); outline-offset: 2px; }

  .spine { width: 9px; flex: 0 0 9px; border-radius: 1px 0 0 1px; }
  .card-body { padding: 11px 12px 12px; flex: 1; min-width: 0; }
  .card-brand { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
  .card-name { font-family: var(--display); font-size: 17px; line-height: 1.2; margin-top: 3px; overflow-wrap: break-word; }
  .card-meta { display: flex; align-items: center; gap: 8px; margin-top: 9px; flex-wrap: wrap; }
  .dots { display: inline-flex; gap: 3px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; border: 1px solid var(--mulberry); }
  .dot.on { background: var(--mulberry); }
  .verdict { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; padding: 2px 6px; border-radius: 2px; }
  .v-yes { background: var(--mulberry); color: var(--paper); }
  .v-maybe { background: rgba(168,134,63,.2); color: var(--brass); }
  .v-no { background: rgba(25,28,36,.08); color: var(--ink-soft); }
  .card-note { font-size: 11.5px; line-height: 1.45; color: var(--ink-soft); margin-top: 8px; overflow-wrap: break-word; }
  .card-foot { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--line-soft); display: flex; justify-content: space-between; gap: 8px; align-items: center; }
  .card-foot a { color: var(--mulberry); text-decoration: none; border-bottom: 1px solid currentColor; }
  .card-edit { border: 0; background: transparent; font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); cursor: pointer; padding: 0; }
  .card-edit:hover { color: var(--mulberry); }

  .rank-list { border: 1px solid var(--line); border-radius: 3px; background: var(--paper); overflow: hidden; }
  .rank-row { display: flex; align-items: center; gap: 13px; padding: 13px 15px; border-bottom: 1px solid var(--line-soft); }
  .rank-row:last-child { border-bottom: 0; }
  .editing .rank-row { cursor: grab; touch-action: none; user-select: none; }
  .rank-row.dragging { opacity: .35; }
  .rank-row.over { box-shadow: inset 0 2px 0 var(--mulberry); }
  .rank-num { font-family: var(--mono); font-size: 15px; color: var(--mulberry); width: 30px; flex: 0 0 30px; }
  .rank-spine { width: 4px; height: 30px; border-radius: 2px; flex: 0 0 4px; }
  .rank-main { flex: 1; min-width: 0; }
  .rank-name { font-family: var(--display); font-size: 16px; line-height: 1.2; }
  .rank-brand { font-family: var(--mono); font-size: 9.5px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-soft); margin-top: 2px; }
  .rank-side { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }

  .state { padding: 70px 24px; text-align: center; }
  .state-title { font-family: var(--display); font-size: 25px; }
  .state-text { font-size: 13.5px; color: var(--ink-soft); max-width: 380px; line-height: 1.55; margin: 10px auto 0; }

  .foot { margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 10px; letter-spacing: .11em; text-transform: uppercase; color: var(--ink-soft); }
  .foot a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  .foot a:hover { color: var(--mulberry); }

  .editbar { background: var(--ink); color: var(--paper); padding: 9px 16px; font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .editbar button { font-family: var(--mono); font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; background: transparent; border: 1px solid rgba(252,251,248,.4); color: var(--paper); padding: 5px 11px; border-radius: 2px; cursor: pointer; }
  .editbar button:hover { background: var(--paper); color: var(--ink); }
  .editbar .grow { flex: 1; }

  .scrim { position: fixed; inset: 0; background: rgba(25,28,36,.5); display: flex; align-items: center; justify-content: center; padding: 18px; z-index: 100; }
  .sheet { background: var(--paper); border-radius: 3px; width: 100%; max-width: 440px; max-height: 88vh; overflow-y: auto; padding: 22px; }
  .sheet h2 { font-family: var(--display); font-size: 24px; font-weight: 400; margin: 0 0 18px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-family: var(--mono); font-size: 9.5px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-soft); margin-bottom: 5px; }
  .field input, .field textarea, .field select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 2px; font-family: var(--body); font-size: 14px; background: #fff; color: var(--ink); }
  .field input:focus, .field textarea:focus, .field select:focus { outline: 2px solid var(--mulberry); outline-offset: -1px; }
  .field textarea { resize: vertical; min-height: 62px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .swatches { display: flex; gap: 7px; flex-wrap: wrap; }
  .sw { width: 27px; height: 27px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
  .sw[aria-pressed="true"] { border-color: var(--ink); }
  .rate { display: flex; gap: 6px; }
  .rate button { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--mulberry); background: transparent; cursor: pointer; padding: 0; }
  .rate button.on { background: var(--mulberry); }
  .sheet-actions { display: flex; gap: 8px; margin-top: 20px; align-items: center; }
  .sheet-actions .spacer { flex: 1; }
  .code { width: 100%; min-height: 240px; font-family: var(--mono); font-size: 11px; line-height: 1.5; }

  @media (max-width: 760px) {
    .metrics { grid-template-columns: repeat(2, 1fr); }
    .mast-title { font-size: 34px; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const LOCAL_KEY = 'tried-draft-v1';
const SWATCHES = ['#77384F', '#A8863F', '#4A6152', '#2E4057', '#8C5A3C', '#6B5B7B', '#B4707E', '#3F4A3C'];
const CATEGORIES = ['Skincare', 'Makeup', 'Hair', 'Body', 'Fragrance', 'Tools', 'Other'];
const ZOOM_MIN = 0.4, ZOOM_MAX = 2.5, ZOOM_STEP = 0.15;
const clampZoom = z => Math.min(ZOOM_MAX, Math.max(ZOOM_MIN, Math.round(z * 100) / 100));
const CARD_W = 224, CARD_H_EST = 260, CANVAS_PAD = 80;
const EDIT = new URLSearchParams(location.search).has('edit');

const uid = () => 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const Dots = ({ n }) => (
  <span className="dots">{[1,2,3,4,5].map(i => <span key={i} className={'dot' + (i <= n ? ' on' : '')} />)}</span>
);
const Verdict = ({ v }) => (
  <span className={'verdict v-' + (v || 'maybe')}>{{ yes: 'Buy again', maybe: 'Maybe', no: 'Never again' }[v] || 'Maybe'}</span>
);

function App() {
  const [meta, setMeta] = useState(null);
  const [items, setItems] = useState([]);
  const [view, setView] = useState('canvas');
  const [filter, setFilter] = useState('All');
  const [editing, setEditing] = useState(null);
  const [showJson, setShowJson] = useState(false);
  const [phase, setPhase] = useState('loading');
  const [narrow, setNarrow] = useState(window.matchMedia('(max-width: 760px)').matches);
  const [zoom, setZoom] = useState(1);
  const [vpSize, setVpSize] = useState({ w: 0, h: 0 });
  const canvasRef = useRef(null);
  const viewportRef = useRef(null);
  const drag = useRef(null);

  useEffect(() => {
    const mq = window.matchMedia('(max-width: 760px)');
    const on = e => setNarrow(e.matches);
    mq.addEventListener('change', on);
    return () => mq.removeEventListener('change', on);
  }, []);

  // load published data, then overlay local draft if editing
  useEffect(() => {
    (async () => {
      let data = null;
      try {
        const r = await fetch('products.json', { cache: 'no-store' });
        if (!r.ok) throw new Error(r.status);
        data = await r.json();
      } catch (e) {
        setPhase('error');
        return;
      }
      setMeta(data);
      let list = Array.isArray(data.items) ? data.items : [];
      if (EDIT) {
        try {
          const draft = localStorage.getItem(LOCAL_KEY);
          if (draft) list = JSON.parse(draft);
        } catch (e) { /* published data stands */ }
      }
      setItems(list);
      setPhase('ready');
    })();
  }, []);

  // persist draft locally while editing
  useEffect(() => {
    if (!EDIT || phase !== 'ready') return;
    try { localStorage.setItem(LOCAL_KEY, JSON.stringify(items)); } catch (e) { /* ignore */ }
  }, [items, phase]);

  const visible = filter === 'All' ? items : items.filter(i => i.category === filter);
  const counts = {};
  items.forEach(i => { if (i.category) counts[i.category] = (counts[i.category] || 0) + 1; });
  const cats = ['All', ...Object.keys(counts)];
  const rated = items.filter(i => i.rating > 0);
  const avg = rated.length ? (rated.reduce((s, i) => s + i.rating, 0) / rated.length).toFixed(1) : '—';
  const again = items.length ? Math.round(items.filter(i => i.verdict === 'yes').length / items.length * 100) : 0;
  const top = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];

  const useCanvas = view === 'canvas' && !narrow;

  // the canvas's logical (unscaled) size: at least the viewport, but grows to
  // fit however far cards have been dragged, so zooming out reveals real room
  const extent = items.reduce((a, i) => ({
    w: Math.max(a.w, (i.x || 0) + CARD_W + CANVAS_PAD),
    h: Math.max(a.h, (i.y || 0) + CARD_H_EST + CANVAS_PAD),
  }), { w: 0, h: 0 });
  const canvasW = Math.max(vpSize.w, extent.w);
  const canvasH = Math.max(vpSize.h, extent.h);

  useEffect(() => {
    if (!useCanvas || !viewportRef.current) return;
    const el = viewportRef.current;
    const update = () => setVpSize({ w: el.clientWidth, h: el.clientHeight });
    update();
    const ro = new ResizeObserver(update);
    ro.observe(el);
    return () => ro.disconnect();
  }, [useCanvas, phase]);

  const onDown = useCallback((e, item) => {
    if (!EDIT || !canvasRef.current || e.target.closest('.card-edit')) return;
    const r = canvasRef.current.getBoundingClientRect();
    drag.current = { id: item.id, dx: (e.clientX - r.left) / zoom - (item.x || 0), dy: (e.clientY - r.top) / zoom - (item.y || 0) };
    e.currentTarget.setPointerCapture(e.pointerId);
    e.currentTarget.classList.add('dragging');
  }, [zoom]);

  const onMove = useCallback((e) => {
    if (!drag.current || !canvasRef.current) return;
    const r = canvasRef.current.getBoundingClientRect();
    const w = e.currentTarget.offsetWidth, h = e.currentTarget.offsetHeight;
    const cw = r.width / zoom, ch = r.height / zoom;
    const x = Math.max(0, Math.min(cw - w, (e.clientX - r.left) / zoom - drag.current.dx));
    const y = Math.max(0, Math.min(Math.max(ch, h + 40) - h, (e.clientY - r.top) / zoom - drag.current.dy));
    setItems(p => p.map(i => i.id === drag.current.id ? { ...i, x, y } : i));
  }, [zoom]);

  const onUp = useCallback((e) => { drag.current = null; e.currentTarget.classList.remove('dragging'); }, []);

  const onWheelZoom = useCallback((e) => {
    if (!useCanvas || !(e.ctrlKey || e.metaKey)) return;
    e.preventDefault();
    setZoom(z => clampZoom(z - e.deltaY * 0.01));
  }, [useCanvas]);

  const onKey = useCallback((e, item) => {
    if (!EDIT) return;
    const s = e.shiftKey ? 40 : 10;
    const m = { ArrowLeft: [-s, 0], ArrowRight: [s, 0], ArrowUp: [0, -s], ArrowDown: [0, s] };
    if (m[e.key]) {
      e.preventDefault();
      setItems(p => p.map(i => i.id === item.id ? { ...i, x: Math.max(0, (i.x||0) + m[e.key][0]), y: Math.max(0, (i.y||0) + m[e.key][1]) } : i));
    }
    if (e.key === 'Enter') { e.preventDefault(); setEditing(item); }
  }, []);

  const [dragId, setDragId] = useState(null);
  const [overId, setOverId] = useState(null);
  function reorder(from, to) {
    if (!from || !to || from === to) return;
    setItems(p => {
      const a = [...p], f = a.findIndex(i => i.id === from), t = a.findIndex(i => i.id === to);
      if (f < 0 || t < 0) return p;
      const [m] = a.splice(f, 1); a.splice(t, 0, m); return a;
    });
  }

  function addNew() {
    const n = items.length;
    setEditing({ id: uid(), name: '', brand: '', category: 'Skincare', color: SWATCHES[n % SWATCHES.length],
      rating: 3, verdict: 'maybe', note: '', link: '', x: 24 + (n % 4) * 248, y: 24 + Math.floor(n / 4) * 190, isNew: true });
  }
  function save(it) {
    const { isNew, ...c } = it;
    setItems(p => isNew ? [...p, c] : p.map(i => i.id === c.id ? c : i));
    setEditing(null);
  }
  function remove(id) { setItems(p => p.filter(i => i.id !== id)); setEditing(null); }

  const publishedJson = () => JSON.stringify({ ...(meta || {}), items }, null, 2);

  function copyJson() {
    navigator.clipboard.writeText(publishedJson()).then(
      () => alert('Copied. Paste it over products.json in GitHub and commit.'),
      () => setShowJson(true)
    );
  }

  if (phase === 'loading') return <div className="wrap"><div className="state"><div className="state-title">Loading</div></div></div>;

  if (phase === 'error') return (
    <div className="wrap">
      <div className="state">
        <div className="state-title">Can't read products.json</div>
        <div className="state-text">
          The data file didn't load. If you're opening this file directly from your computer, browsers block that —
          it needs to be served. Push both files to GitHub Pages, or run <code>python3 -m http.server</code> in this folder
          and open localhost:8000.
        </div>
      </div>
    </div>
  );

  return (
    <>
      {EDIT && (
        <div className="editbar">
          <span>Edit mode — changes are saved in this browser only</span>
          <span className="grow" />
          <button onClick={addNew}>+ Add</button>
          <button onClick={copyJson}>Copy products.json</button>
          <button onClick={() => { if (confirm('Discard local changes and reload the published version?')) { localStorage.removeItem(LOCAL_KEY); location.reload(); } }}>Reset</button>
        </div>
      )}

      <div className={'wrap' + (EDIT ? ' editing' : '')}>
        <div className="mast">
          <div>
            <h1 className="mast-title">{meta?.title || 'Tried'}</h1>
            <div className="mast-sub">{items.length} products · Updated {meta?.updated || ''}</div>
            {meta?.intro && <p className="intro">{meta.intro}</p>}
          </div>
          <div className="mast-actions">
            <div className="seg">
              <button aria-pressed={view === 'canvas'} onClick={() => setView('canvas')}>Shelf</button>
              <button aria-pressed={view === 'rank'} onClick={() => setView('rank')}>Ranking</button>
            </div>
          </div>
        </div>

        <div className="metrics">
          <div className="metric"><div className="metric-label">Logged</div><div className="metric-value">{items.length}</div></div>
          <div className="metric"><div className="metric-label">Avg rating</div><div className="metric-value">{avg}{avg !== '—' && <span className="unit">/5</span>}</div></div>
          <div className="metric"><div className="metric-label">Would buy again</div><div className="metric-value">{again}<span className="unit">%</span></div></div>
          <div className="metric"><div className="metric-label">Most tried</div><div className="metric-value small">{top || '—'}</div></div>
        </div>

        <div className="filters">
          {cats.map(c => (
            <button key={c} className="chip" aria-pressed={filter === c} onClick={() => setFilter(c)}>
              {c}{c !== 'All' && ' · ' + counts[c]}
            </button>
          ))}
          <div className="filters-right">
            {useCanvas && (
              <div className="zoom">
                <button onClick={() => setZoom(z => clampZoom(z - ZOOM_STEP))} aria-label="Zoom out">−</button>
                <button className="zoom-value" onClick={() => setZoom(1)} aria-label="Reset zoom to 100%">{Math.round(zoom * 100)}%</button>
                <button onClick={() => setZoom(z => clampZoom(z + ZOOM_STEP))} aria-label="Zoom in">+</button>
              </div>
            )}
            {EDIT && <span className="hint">{view === 'canvas' ? (narrow ? 'Widen the window to rearrange' : 'Drag cards anywhere · Ctrl/⌘ + scroll to zoom') : 'Drag rows to reorder'}</span>}
          </div>
        </div>

        {view === 'canvas' ? (
          useCanvas ? (
            <div className="canvas-viewport full-bleed" ref={viewportRef} onWheel={onWheelZoom}>
              <div className={'canvas' + (EDIT ? ' editing' : '')} ref={canvasRef}
                style={{ transform: 'scale(' + zoom + ')', width: canvasW + 'px', height: canvasH + 'px' }}>
                {visible.length === 0 && (
                  <div className="state"><div className="state-title">Nothing here yet</div>
                    <div className="state-text">No products in this category.</div></div>
                )}
                {visible.map(item => (
                  <Card key={item.id} item={item} onEdit={setEditing} editable={EDIT}
                    style={{ left: (item.x || 0) + 'px', top: (item.y || 0) + 'px' }}
                    onPointerDown={(e) => onDown(e, item)} onPointerMove={onMove}
                    onPointerUp={onUp} onPointerCancel={onUp} onKeyDown={(e) => onKey(e, item)} />
                ))}
              </div>
            </div>
          ) : (
            <div className="flow">
              {visible.map(item => <Card key={item.id} item={item} onEdit={setEditing} editable={EDIT} />)}
            </div>
          )
        ) : (
          <div className="rank-list">
            {visible.length === 0 ? (
              <div className="state"><div className="state-title">Nothing to rank</div></div>
            ) : visible.map((item, idx) => (
              <div key={item.id}
                className={'rank-row' + (dragId === item.id ? ' dragging' : '') + (overId === item.id ? ' over' : '')}
                onPointerDown={(e) => { if (!EDIT || e.target.closest('.card-edit')) return; setDragId(item.id); e.currentTarget.setPointerCapture(e.pointerId); }}
                onPointerMove={(e) => {
                  if (!dragId) return;
                  const el = document.elementFromPoint(e.clientX, e.clientY);
                  const row = el && el.closest('.rank-row');
                  if (row && row.parentNode) {
                    const t = visible[Array.from(row.parentNode.children).indexOf(row)];
                    if (t) setOverId(t.id);
                  }
                }}
                onPointerUp={() => { reorder(dragId, overId); setDragId(null); setOverId(null); }}
                onPointerCancel={() => { setDragId(null); setOverId(null); }}>
                <span className="rank-num">{String(idx + 1).padStart(2, '0')}</span>
                <span className="rank-spine" style={{ background: item.color }} />
                <span className="rank-main">
                  <div className="rank-name">{item.name || 'Untitled'}</div>
                  <div className="rank-brand">{item.brand || '—'} · {item.category}</div>
                </span>
                <span className="rank-side">
                  <Dots n={item.rating} /><Verdict v={item.verdict} />
                  {EDIT && <button className="card-edit" onClick={() => setEditing(item)}>Edit</button>}
                </span>
              </div>
            ))}
          </div>
        )}

        <div className="foot">
          <span>{meta?.handle || ''}</span>
          <span>Nothing here is sponsored</span>
        </div>
      </div>

      {editing && <Editor item={editing} onSave={save} onCancel={() => setEditing(null)} onDelete={remove} />}
      {showJson && (
        <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) setShowJson(false); }}>
          <div className="sheet">
            <h2>Copy this into products.json</h2>
            <textarea className="code" readOnly value={publishedJson()} onFocus={(e) => e.target.select()} />
            <div className="sheet-actions"><button className="btn btn-solid" onClick={() => setShowJson(false)}>Done</button></div>
          </div>
        </div>
      )}
    </>
  );
}

function Card({ item, onEdit, editable, style, ...handlers }) {
  return (
    <div className="card" style={style} tabIndex={editable ? 0 : -1} {...handlers}>
      <div className="spine" style={{ background: item.color }} />
      <div className="card-body">
        {item.brand && <div className="card-brand">{item.brand}</div>}
        <div className="card-name">{item.name || 'Untitled'}</div>
        <div className="card-meta"><Dots n={item.rating} /><Verdict v={item.verdict} /></div>
        {item.note && <div className="card-note">{item.note}</div>}
        <div className="card-foot">
          <span>{item.category}</span>
          {editable
            ? <button className="card-edit" onClick={() => onEdit(item)}>Edit</button>
            : item.link ? <a href={item.link} target="_blank" rel="noopener noreferrer nofollow">Look</a> : null}
        </div>
      </div>
    </div>
  );
}

function Editor({ item, onSave, onCancel, onDelete }) {
  const [d, setD] = useState(item);
  const set = (k, v) => setD(p => ({ ...p, [k]: v }));
  return (
    <div className="scrim" onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}>
      <div className="sheet">
        <h2>{item.isNew ? 'Add a product' : 'Edit product'}</h2>
        <div className="field"><label htmlFor="f1">Product</label>
          <input id="f1" autoFocus value={d.name} onChange={e => set('name', e.target.value)} placeholder="What is it" /></div>
        <div className="row2">
          <div className="field"><label htmlFor="f2">Brand</label>
            <input id="f2" value={d.brand} onChange={e => set('brand', e.target.value)} /></div>
          <div className="field"><label htmlFor="f3">Category</label>
            <select id="f3" value={d.category} onChange={e => set('category', e.target.value)}>
              {CATEGORIES.map(c => <option key={c}>{c}</option>)}</select></div>
        </div>
        <div className="field"><label>Rating</label>
          <div className="rate">{[1,2,3,4,5].map(n => (
            <button key={n} className={n <= d.rating ? 'on' : ''} aria-label={n + ' of 5'} onClick={() => set('rating', n)} />))}</div></div>
        <div className="field"><label htmlFor="f4">Would you buy it again</label>
          <select id="f4" value={d.verdict} onChange={e => set('verdict', e.target.value)}>
            <option value="yes">Yes</option><option value="maybe">Maybe</option><option value="no">No</option></select></div>
        <div className="field"><label>Swatch</label>
          <div className="swatches">{SWATCHES.map(c => (
            <button key={c} className="sw" style={{ background: c }} aria-pressed={d.color === c}
              aria-label={'Swatch ' + c} onClick={() => set('color', c)} />))}</div></div>
        <div className="field"><label htmlFor="f5">Notes</label>
          <textarea id="f5" value={d.note} onChange={e => set('note', e.target.value)} placeholder="What you thought" /></div>
        <div className="field"><label htmlFor="f6">Link (optional)</label>
          <input id="f6" value={d.link || ''} onChange={e => set('link', e.target.value)} placeholder="https://" /></div>
        <div className="sheet-actions">
          <button className="btn btn-solid" onClick={() => onSave(d)}>Save</button>
          <button className="btn" onClick={onCancel}>Cancel</button>
          <span className="spacer" />
          {!item.isNew && <button className="btn btn-quiet" onClick={() => onDelete(d.id)}>Delete</button>}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
